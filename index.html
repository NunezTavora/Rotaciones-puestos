<title>Rotación de Puestos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra de pestañas fija arriba; una sección por puesto, de caliente a frío; apoyo manual al final. */
:root {
  --bg: #edefec;
  --surface: #fafbf9;
  --ink: #15191c;
  --muted: #5b6469;
  --line: #d2d7d3;
  --action: #15191c;
  --action-ink: #fafbf9;
  --warn: #b3261e;
  --ok: #2d6a3e;
  --hit: #fff2b8;
  --h0: #d8431e;
  --h1: #ea8a1f;
  --h2: #5f9c72;
  --h3: #3e86b8;
  --h4: #3b5ba8;
  --hF: #8a9296;
  --hL: #7b5ea7;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111416; --surface: #1a1f22; --ink: #eceeed; --muted: #98a2a7; --line: #2c3337;
    --action: #eceeed; --action-ink: #111416; --warn: #ff8a80; --ok: #8fd1a2; --hit: #5a4b10;
    --h0: #f0643f; --h1: #f5a14a; --h2: #78b88b; --h3: #5ba4d6; --h4: #7f9be0; --hF: #8e989d; --hL: #a88bd9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111416; --surface: #1a1f22; --ink: #eceeed; --muted: #98a2a7; --line: #2c3337;
  --action: #eceeed; --action-ink: #111416; --warn: #ff8a80; --ok: #8fd1a2; --hit: #5a4b10;
  --h0: #f0643f; --h1: #f5a14a; --h2: #78b88b; --h3: #5ba4d6; --h4: #7f9be0; --hF: #8e989d; --hL: #a88bd9;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 720px; margin: 0 auto; }
header { padding-top: 16px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 34px; letter-spacing: .01em; text-transform: uppercase; margin: 0; line-height: 1; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
.status { margin-top: 14px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; }
.status .now { font-family: var(--display); font-weight: 600; font-size: 22px; text-transform: uppercase; }
.status .count { font-family: var(--mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.status small { color: var(--muted); width: 100%; }
nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 12px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
nav button { font-family: var(--display); font-weight: 600; font-size: 18px; text-transform: uppercase; letter-spacing: .03em; padding: 10px 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; cursor: pointer; min-width: 0; }
nav button small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--muted); text-transform: none; letter-spacing: 0; }
nav button[aria-selected="true"] { background: var(--action); color: var(--action-ink); border-color: var(--action); }
nav button[aria-selected="true"] small { color: inherit; opacity: .8; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--h3); outline-offset: 2px; }
section.pos { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 12px 14px; }
.pos-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.heat { width: 6px; align-self: stretch; border-radius: 3px; min-height: 26px; }
.pos-head h2 { font-family: var(--display); font-weight: 600; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; margin: 0; flex: 1; }
.pos-head .cnt { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.hint { margin: -4px 0 10px; font-size: 13px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.slot { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.slot label { font-size: 11px; color: var(--muted); font-family: var(--mono); }
input[type=text], input[type=time], input[type=search] {
  width: 100%; min-width: 0; font: 500 16px var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 9px 10px;
}
input.dup { border-color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
.rules { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px; font-size: 14px; }
.rules .r { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.rules ul { margin: 0; padding-left: 18px; color: var(--warn); }
.rules .good { margin: 0; color: var(--ok); }
.notice { margin-top: 12px; background: var(--surface); border: 1px solid var(--warn); border-radius: 6px; padding: 12px; color: var(--warn); font-size: 14px; }
.notice ul { margin: 6px 0 0; padding-left: 18px; }
.settings { margin-top: 12px; display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
.settings label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: 220px; }
.warnmsg { color: var(--warn); font-size: 14px; margin: 10px 0 0; }
.actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: 600 15px var(--body); padding: 11px 16px; border-radius: 6px; border: 1px solid var(--action); background: var(--action); color: var(--action-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 15px var(--mono); padding: 6px 10px; border-radius: 5px; background: var(--bg); border: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.chip small { display: block; font: 400 11px var(--body); color: var(--muted); }
.chip small.same { color: var(--warn); }
.chip.hit { background: var(--hit); border-color: var(--ink); }
.tools { margin-top: 12px; display: grid; gap: 8px; }
.trace { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 15px; }
.trace b { font-family: var(--mono); font-weight: 500; }
.trace ol { margin: 6px 0 0; padding-left: 20px; }
.trace li { margin: 2px 0; }
textarea { width: 100%; min-height: 160px; margin-top: 10px; font: 14px var(--mono); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
.legend { margin: 10px 0 0; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.legend i { flex: 1; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--h0), var(--h1), var(--h2), var(--h3), var(--h4)); }
.apart { margin: 18px 0 0; font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.swrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.swtime { font: 500 44px var(--mono); font-variant-numeric: tabular-nums; line-height: 1.1; }
.swx { font-size: 15px; color: var(--muted); }
.swtime.over, .swx.over { color: var(--warn); font-weight: 600; }
.bar { height: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin: 8px 0 10px; }
.bar i { display: block; height: 100%; width: 0; background: var(--h2); }
.ord { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ord li { display: grid; grid-template-columns: 32px 1fr; gap: 2px 10px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); min-width: 0; }
.ord li.first { border-color: var(--ink); }
.ord .num { font: 700 26px var(--display); line-height: 1; grid-row: span 3; }
.ord .mv { font: 600 19px var(--display); text-transform: uppercase; letter-spacing: .02em; }
.ord .tag { font-size: 12px; color: var(--muted); }
.ord .who { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.ord .who span { font: 500 14px var(--mono); padding: 3px 8px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); }
@media (prefers-reduced-motion: no-preference) { nav button { transition: background .15s, color .15s; } .bar i { transition: width .4s linear; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Rotación de Puestos</h1>
    <p class="sub">3 tramos de 1 h 30 min · 2 cambios en 4 h 30 min</p>
    <div class="status" id="status"></div>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>

<script>
var POS = [
  { name: "Water Spider", short: "Spider", n: 6 },
  { name: "Feeder", short: "Feeder", n: 6 },
  { name: "Inductor", short: "Inductor", n: 6 },
  { name: "Pusher", short: "Pusher", n: 5 },
  { name: "Diverter", short: "Diverter", n: 4 }
];
var LIFT = ["Feeder", "Inductor", "Water Spider", "Stower 1", "Stower 2", "5S"];
var MANUAL = {
  lift: { title: "Team Lift", color: "var(--hL)", labels: LIFT },
  five: { title: "5S", color: "var(--hF)", labels: ["5S 1", "5S 2", "5S 3", "5S 4", "5S 5", "5S 6"] }
};
var SMAX = 6, PMIN = 1, PMAX = 5, DMIN = 2, DMAX = 4, LIMIT = 600000, KEY = "rotpuestos.v2";
var TOTAL = 0, posOfSlot = [], firstOfPos = [];
POS.forEach(function (p, pi) { firstOfPos.push(posOfSlot.length); for (var k = 0; k < p.n; k++) posOfSlot.push(pi); });
TOTAL = posOfSlot.length;

function blank() { return [0, 1, 2].map(function () { return new Array(6).fill(""); }); }
var state = { start: "06:00", slots: [], lift: null, five: null, timers: null };
var tab = "plantilla", query = "", lastPlan = null, buzzed = {};
try {
  var saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved && saved.slots) {
    if (saved.lift && !saved.five) saved.lift = saved.lift.map(function (r) { return [r[0], r[1], r[4], r[2], r[3], r[5]]; });
    var olds = { 23: [5, 6, 6, 3, 3], 25: [5, 6, 6, 4, 4], 31: [5, 6, 6, 4, 4, 6], 33: [6, 6, 6, 5, 4, 6] };
    if (saved.slots.length === TOTAL) state = saved;
    else if (olds[saved.slots.length]) {
      var oldN = olds[saved.slots.length], at = 0, ns = [], fv = [];
      oldN.forEach(function (n, pi) {
        var tgt = pi < 5 ? ns : fv, cap = pi < 5 ? POS[pi].n : 6;
        for (var k = 0; k < cap; k++) tgt.push(k < n ? saved.slots[at + k] : "");
        at += n;
      });
      var five = saved.five;
      if (!five && fv.length) { five = blank(); five[0] = fv; }
      state = { start: saved.start || "06:00", slots: ns, lift: saved.lift, five: five, timers: saved.timers };
    }
  }
} catch (e) {}
while (state.slots.length < TOTAL) state.slots.push("");
if (!state.lift || state.lift.length !== 3) state.lift = blank();
if (!state.five || state.five.length !== 3) state.five = blank();
if (!state.timers || state.timers.length !== 2) state.timers = [{ acc: 0, since: null }, { acc: 0, since: null }];
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function pad(n) { return (n < 10 ? "0" : "") + n; }
function startMin() { var p = (state.start || "06:00").split(":"); return (+p[0]) * 60 + (+p[1]); }
function hm(min) { min = ((min % 1440) + 1440) % 1440; return pad(Math.floor(min / 60)) + ":" + pad(min % 60); }
function range(t) { var s = startMin() + t * 90; return hm(s) + "–" + hm(s + 90); }
function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

/* ---------- reglas ---------- */
function baseCounts() {
  var c = [0, 0, 0, 0, 0];
  state.slots.forEach(function (v, i) { if (v.trim()) c[posOfSlot[i]]++; });
  return c;
}
function validate(c) {
  var m = [];
  if (c[0] < 1 || c[0] > SMAX) m.push("Water Spider: debe haber entre 1 y " + SMAX + " personas (hay " + c[0] + ").");
  if (c[1] !== c[2]) m.push("Feeder e Inductor deben tener el mismo número (hay " + c[1] + " y " + c[2] + ").");
  if (c[3] < PMIN || c[3] > PMAX) m.push("Pusher: debe haber entre " + PMIN + " y " + PMAX + " personas (hay " + c[3] + ").");
  if (c[4] < DMIN || c[4] > DMAX) m.push("Diverter: debe haber entre " + DMIN + " y " + DMAX + " personas (hay " + c[4] + ").");
  return m;
}
function workers() {
  var w = [];
  state.slots.forEach(function (v, i) { if (v.trim()) w.push({ login: v.trim(), p0: posOfSlot[i] }); });
  return w;
}
function manualHas(kind, t) { return state[kind][t].some(function (v) { return v.trim(); }); }
function showManual(kind) { return manualHas(kind, 0) || manualHas(kind, 1) || manualHas(kind, 2); }

/* ---------- rotación (solo la escala de caliente a frío) ---------- */
/* Coste de pasar de p a q: lo normal es enfriarse un paso; tras Diverter se vuelve a Water Spider; repetir puesto casi nunca. */
function mcost(p, q, hist) {
  var d = (q - p + 5) % 5, c = d === 0 ? 60 : 2 * (d - 1);
  if (d !== 0 && hist.indexOf(q) > -1) c += 8;
  return c;
}
function hungarian(a, n) {
  var INF = 1e9, u = new Array(n + 1).fill(0), v = new Array(n + 1).fill(0), p = new Array(n + 1).fill(0), way = new Array(n + 1).fill(0);
  for (var i = 1; i <= n; i++) {
    p[0] = i; var j0 = 0, minv = new Array(n + 1).fill(INF), used = new Array(n + 1).fill(false);
    do {
      used[j0] = true; var i0 = p[j0], delta = INF, j1 = 0;
      for (var j = 1; j <= n; j++) if (!used[j]) {
        var cur = a[i0 - 1][j - 1] - u[i0] - v[j];
        if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
        if (minv[j] < delta) { delta = minv[j]; j1 = j; }
      }
      for (var k = 0; k <= n; k++) { if (used[k]) { u[p[k]] += delta; v[k] -= delta; } else minv[k] -= delta; }
      j0 = j1;
    } while (p[j0] !== 0);
    do { var jj = way[j0]; p[j0] = p[jj]; j0 = jj; } while (j0);
  }
  var res = new Array(n);
  for (var x = 1; x <= n; x++) res[p[x] - 1] = x - 1;
  return res;
}
function solveStep(pos, hist, vec) {
  var n = pos.length, slotPos = [];
  vec.forEach(function (c, q) { for (var k = 0; k < c; k++) slotPos.push(q); });
  var a = pos.map(function (p, w) { return slotPos.map(function (q) { return mcost(p, q, hist[w]); }); });
  var asg = hungarian(a, n), np = [];
  for (var w = 0; w < n; w++) np[w] = slotPos[asg[w]];
  return np;
}
function computePlan() {
  var W = workers(), p0 = W.map(function (w) { return w.p0; }), vec = baseCounts();
  var hist = W.map(function (w) { return [w.p0]; });
  var p1 = solveStep(p0, hist, vec), h1 = hist.map(function (h, i) { return h.concat([p1[i]]); });
  var p2 = solveStep(p1, h1, vec);
  return { W: W, p: [p0, p1, p2], vec: vec };
}

/* ---------- cronómetro ---------- */
function fmtMs(ms) { var s = Math.floor(ms / 1000); return pad(Math.floor(s / 60)) + ":" + pad(s % 60); }
function swHtml(t) {
  var T = state.timers[t - 1], btns;
  if (T.since) btns = '<button class="btn" data-sw="pause" data-st="' + t + '">Pausar</button>';
  else if (T.acc > 0) btns = '<button class="btn" data-sw="start" data-st="' + t + '">Reanudar</button><button class="btn ghost" data-sw="reset" data-st="' + t + '">Reiniciar</button>';
  else btns = '<button class="btn" data-sw="start" data-st="' + t + '">Iniciar cambios</button>';
  return '<section class="pos sw"><div class="pos-head"><span class="heat" style="background:var(--ink)"></span><h2>Cronómetro de cambios</h2><span class="cnt">máx. 10 min</span></div>' +
    '<div class="swrow"><span class="swtime" id="swt">00:00</span><span class="swx" id="swx"></span></div><div class="bar"><i id="swbar"></i></div>' +
    '<p class="hint">Inícialo cuando empiecen los cambios. Ningún puesto de la escala puede quedarse sin cubrir mientras se hacen.</p><div class="actions" style="margin-top:0">' + btns + "</div></section>";
}
function updateSw() {
  if (tab !== "1" && tab !== "2") return;
  var k = +tab - 1, T = state.timers[k], ms = T.acc + (T.since ? Date.now() - T.since : 0);
  var el = document.getElementById("swt"); if (!el) return;
  var x = document.getElementById("swx"), bar = document.getElementById("swbar"), extra = ms - LIMIT, over = extra >= 1000;
  el.textContent = fmtMs(ms);
  if (over) x.textContent = T.since ? "+" + fmtMs(extra) + " de más" : "Tiempo extra registrado: " + fmtMs(extra);
  else if (T.since) x.textContent = "Quedan " + fmtMs(Math.max(0, LIMIT - ms));
  else x.textContent = ms > 0 ? "Pausado" : "Listo para empezar";
  x.className = "swx" + (over ? " over" : "");
  el.className = "swtime" + (over ? " over" : "");
  bar.style.width = Math.min(100, ms / LIMIT * 100) + "%";
  bar.style.background = over ? "var(--warn)" : (ms >= LIMIT * 0.8 ? "var(--h1)" : "var(--h2)");
  if (T.since && ms >= LIMIT && !buzzed[k]) { buzzed[k] = true; try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) {} }
}

/* ---------- orden recomendado de los cambios ---------- */
/* Los desplazamientos más largos van primero: pasar de un puesto frío a uno caliente es lo que más tarda. */
function orderHtml(P, t) {
  var prev = P.p[t - 1], arr = P.p[t], g = {};
  P.W.forEach(function (w, i) {
    var p = prev[i], q = arr[i]; if (p === q) return;
    var key = p + ">" + q; (g[key] = g[key] || { p: p, q: q, names: [] }).names.push(w.login);
  });
  var rows = Object.keys(g).map(function (k) { var m = g[k]; m.score = Math.abs(m.q - m.p) + (m.q < m.p ? 0.5 : 0); return m; });
  rows.sort(function (a, b) { return a.score - b.score || a.p - b.p; });
  var html = '<section class="pos"><div class="pos-head"><span class="heat" style="background:var(--ink)"></span><h2>Orden de los cambios</h2></div>';
  if (!rows.length) return html + '<p class="hint">No hay cambios de puesto en este tramo.</p></section>';
  html += '<p class="hint">Empieza por el primero y sigue en orden: de los desplazamientos más cortos a los más largos. Cubre cada puesto antes de dejarlo libre.</p><ol class="ord">';
  rows.forEach(function (m, i) {
    var n = Math.abs(m.q - m.p), up = m.q < m.p;
    html += '<li' + (i === 0 ? ' class="first"' : "") + '><span class="num">' + (i + 1) + '</span><span class="mv">' + POS[m.p].name + " → " + POS[m.q].name + '</span>' +
      '<span class="tag">' + (up ? "De más frío a más caliente" : "A más frío") + " · salto de " + n + (n === 1 ? " puesto" : " puestos") + " · " + m.names.length + (m.names.length === 1 ? " persona" : " personas") + (i === 0 ? " · empieza aquí" : (i === rows.length - 1 && rows.length > 1 ? " · el más lejos, al final" : "")) + "</span>" +
      '<span class="who">' + m.names.map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("") + "</span></li>";
  });
  html += "</ol>";
  if (showManual("lift") || showManual("five")) html += '<p class="hint" style="margin:10px 0 0">Después, cambia a mano Team Lift y 5S.</p>';
  return html + "</section>";
}

/* ---------- vistas ---------- */
function renderTabs() {
  var items = [["plantilla", "Tramo 1", hm(startMin())]];
  for (var t = 1; t < 3; t++) items.push([String(t), "Tramo " + (t + 1), hm(startMin() + t * 90) + (state.timers[t - 1].since ? " ●" : "")]);
  document.getElementById("tabs").innerHTML = items.map(function (it) {
    return '<button role="tab" data-tab="' + it[0] + '" aria-selected="' + (String(tab) === it[0]) + '">' + it[1] + "<small>" + it[2] + "</small></button>";
  }).join("");
}
function rulesHtml() {
  var errs = validate(baseCounts());
  var h = '<p class="r">Spider 1–' + SMAX + ' · Feeder = Inductor · Pusher ' + PMIN + '–' + PMAX + ' · Diverter ' + DMIN + '–' + DMAX + ' · Team Lift y 5S: a mano</p>';
  h += errs.length ? "<ul>" + errs.map(function (e) { return "<li>" + e + "</li>"; }).join("") + "</ul>" : '<p class="good">El reparto cumple las reglas.</p>';
  return h;
}
function manualHtml(kind, t, inPlantilla) {
  var M = MANUAL[kind], cells = "", filled = 0;
  M.labels.forEach(function (name, k) {
    var v = state[kind][t][k]; if (v.trim()) filled++;
    cells += '<div class="slot"><label for="' + kind + t + '_' + k + '">' + name + '</label><input class="lg" type="text" id="' + kind + t + '_' + k + '" data-g="' + kind + '" data-t="' + t + '" data-k="' + k + '" value="' + esc(v) + '" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="login"></div>';
  });
  var hint = "Fuera de la escala de calor. Se rota a mano." + (inPlantilla ? " Aquí va el tramo 1; los demás tramos se editan en su pestaña." : "");
  var copy = !inPlantilla && t > 0 ? '<div class="actions"><button class="btn ghost" data-copy="' + kind + '" data-t="' + t + '">Copiar del tramo anterior</button></div>' : "";
  return '<section class="pos"><div class="pos-head"><span class="heat" style="background:' + M.color + '"></span><h2>' + M.title + '</h2><span class="cnt" id="mcnt_' + kind + '">' + filled + '/6</span></div><p class="hint">' + hint + '</p><div class="grid">' + cells + "</div>" + copy + "</section>";
}
function rangesText() { return "Tramo 1: " + range(0) + " · Tramo 2: " + range(1) + " · Tramo 3: " + range(2); }
function renderPlantilla() {
  var html = '<div class="settings"><label>Inicio del turno<input type="time" id="start" value="' + state.start + '"></label><p class="hint" id="t1range" style="margin:0">' + rangesText() + "</p></div>";
  POS.forEach(function (p, pi) {
    var filled = 0, cells = "";
    for (var k = 0; k < p.n; k++) {
      var idx = firstOfPos[pi] + k, v = state.slots[idx];
      if (v.trim()) filled++;
      cells += '<div class="slot"><label for="s' + idx + '">' + p.short + " " + (k + 1) + '</label><input class="lg" type="text" id="s' + idx + '" data-i="' + idx + '" value="' + esc(v) + '" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="login"></div>';
    }
    html += '<section class="pos"><div class="pos-head"><span class="heat" style="background:var(--h' + pi + ')"></span><h2>' + p.name + '</h2><span class="cnt" id="cnt' + pi + '">' + filled + "/" + p.n + '</span></div><div class="grid">' + cells + "</div></section>";
  });
  html += '<div class="legend"><span>Caliente</span><i></i><span>Frío</span></div>';
  html += '<p class="apart">Fuera de la escala · rotación manual</p>' + manualHtml("lift", 0, true) + manualHtml("five", 0, true);
  html += '<div class="rules" id="rules">' + rulesHtml() + "</div>";
  html += '<p class="warnmsg" id="dupmsg" hidden>Hay logins repetidos. Revisa los campos marcados en rojo.</p>';
  html += '<div class="actions"><button class="btn" id="go" data-go="1"' + (validate(baseCounts()).length ? " disabled" : "") + '>Ver Tramo 2</button><button class="btn ghost" id="clear">Vaciar todo</button></div>';
  document.getElementById("view").innerHTML = html;
}
function refreshManualCount(kind, t) {
  var el = document.getElementById("mcnt_" + kind);
  if (el) el.textContent = state[kind][t].filter(function (v) { return v.trim(); }).length + "/6";
}
function markDups() {
  var lists;
  if (tab === "plantilla") lists = state.slots.concat(state.lift[0], state.five[0]);
  else { var t = +tab; lists = state.lift[t].concat(state.five[t]); if (t === 0) lists = lists.concat(state.slots); }
  var cnt = {}, any = false;
  lists.forEach(function (v) { var k = v.trim().toLowerCase(); if (k) cnt[k] = (cnt[k] || 0) + 1; });
  document.querySelectorAll("input.lg").forEach(function (inp) {
    var k = inp.value.trim().toLowerCase(), d = !!(k && cnt[k] > 1);
    inp.classList.toggle("dup", d); if (d) any = true;
  });
  var m = document.getElementById("dupmsg"); if (m) m.hidden = !any;
}
function refreshPlantillaMarks() {
  var c = baseCounts();
  POS.forEach(function (p, pi) { var el = document.getElementById("cnt" + pi); if (el) el.textContent = c[pi] + "/" + p.n; });
  var r = document.getElementById("rules"); if (r) r.innerHTML = rulesHtml();
  var g = document.getElementById("go"); if (g) g.disabled = validate(c).length > 0;
  renderTabs(); markDups();
}
function renderTrace() {
  var el = document.getElementById("trace"); if (!el) return;
  var q = query.trim().toLowerCase();
  if (!q) { el.innerHTML = ""; return; }
  var cands = [];
  if (lastPlan) lastPlan.W.forEach(function (w) { cands.push(w.login); });
  ["lift", "five"].forEach(function (g) { state[g].forEach(function (row) { row.forEach(function (v) { if (v.trim()) cands.push(v.trim()); }); }); });
  var hit = null;
  cands.forEach(function (c) { if (!hit && c.toLowerCase() === q) hit = c; });
  if (!hit) cands.forEach(function (c) { if (!hit && c.toLowerCase().indexOf(q) > -1) hit = c; });
  if (!hit) { el.innerHTML = '<div class="trace">No hay ningún login con ese texto.</div>'; return; }
  var login = hit.toLowerCase(), li = "";
  for (var t = 0; t < 3; t++) {
    var parts = [];
    if (lastPlan) lastPlan.W.forEach(function (w, i) { if (w.login.toLowerCase() === login) parts.push(POS[lastPlan.p[t][i]].name); });
    state.lift[t].forEach(function (v, k) { if (v.trim().toLowerCase() === login) parts.push("Team Lift · " + LIFT[k]); });
    state.five[t].forEach(function (v) { if (v.trim().toLowerCase() === login) parts.push("5S"); });
    li += "<li>" + range(t) + " · " + (parts.length ? parts.join(" / ") : "sin puesto asignado") + "</li>";
  }
  el.innerHTML = '<div class="trace"><b>' + esc(hit) + "</b><ol>" + li + "</ol></div>";
}
function manualTail(t) {
  var h = "";
  if (showManual("lift") || showManual("five")) h += '<p class="apart">Fuera de la escala · rotación manual</p>';
  if (showManual("lift")) h += manualHtml("lift", t, false);
  if (showManual("five")) h += manualHtml("five", t, false);
  return h + '<p class="warnmsg" id="dupmsg" hidden>Hay logins repetidos en este tramo. Revisa los campos marcados en rojo.</p>';
}
function renderTramo(t) {
  var errs = validate(baseCounts()), html = t > 0 ? swHtml(t) : "";
  lastPlan = null;
  if (errs.length) {
    html += '<div class="notice">El reparto del Tramo 1 no cumple las reglas, así que no se puede calcular la rotación.<ul>' + errs.map(function (e) { return "<li>" + e + "</li>"; }).join("") + '</ul></div><div class="actions"><button class="btn" data-go="plantilla">Corregir Tramo 1</button></div>';
    document.getElementById("view").innerHTML = html + manualTail(t); return;
  }
  var P = computePlan();
  lastPlan = P;
  var q = query.trim().toLowerCase(), arr = P.p[t], prev = t > 0 ? P.p[t - 1] : null, stay = 0;
  if (prev) { arr.forEach(function (p, w) { if (p === prev[w]) stay++; }); html += orderHtml(P, t); }
  html += '<div class="tools"><input type="search" id="q" placeholder="Buscar un login" value="' + esc(query) + '" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Buscar un login"><div id="trace"></div></div>';
  if (stay) html += '<div class="notice">' + stay + (stay === 1 ? " persona repite" : " personas repiten") + " puesto en este cambio: con el mismo número de personas por puesto no hay otra combinación.</div>";
  POS.forEach(function (p, pi) {
    var chips = "", n = 0;
    P.W.forEach(function (w, wi) {
      if (arr[wi] !== pi) return;
      n++;
      var sub = "";
      if (prev) sub = prev[wi] === pi ? '<small class="same">mismo puesto</small>' : "<small>desde " + POS[prev[wi]].short + "</small>";
      chips += '<span class="chip' + (q && w.login.toLowerCase().indexOf(q) > -1 ? " hit" : "") + '" data-login="' + esc(w.login.toLowerCase()) + '">' + esc(w.login) + sub + "</span>";
    });
    html += '<section class="pos"><div class="pos-head"><span class="heat" style="background:var(--h' + pi + ')"></span><h2>' + p.name + '</h2><span class="cnt">' + n + (n === 1 ? " persona" : " personas") + '</span></div><div class="chips">' + chips + "</div></section>";
  });
  html += manualTail(t);
  html += '<div class="actions"><button class="btn" id="copy">Copiar plan completo</button></div><div id="copybox"></div>';
  document.getElementById("view").innerHTML = html;
  renderTrace();
}
function planText() {
  if (validate(baseCounts()).length) return "El reparto del Tramo 1 no cumple las reglas.";
  var P = computePlan(), out = [];
  for (var t = 0; t < 3; t++) {
    out.push("TRAMO " + (t + 1) + " · " + range(t));
    POS.forEach(function (p, pi) {
      var names = [];
      P.W.forEach(function (w, wi) { if (P.p[t][wi] === pi) names.push(w.login); });
      out.push(p.name + ": " + (names.length ? names.join(", ") : "—"));
    });
    if (showManual("lift")) {
      var lf = LIFT.map(function (nm, k) { var v = state.lift[t][k].trim(); return v ? nm + " " + v : ""; }).filter(Boolean);
      if (lf.length) out.push("Team Lift: " + lf.join(", "));
    }
    if (showManual("five")) {
      var fv = state.five[t].map(function (v) { return v.trim(); }).filter(Boolean);
      if (fv.length) out.push("5S: " + fv.join(", "));
    }
    out.push("");
  }
  return out.join("\n").trim();
}
function render() {
  renderTabs();
  if (tab === "plantilla") renderPlantilla(); else renderTramo(+tab);
  markDups(); updateSw();
}

document.addEventListener("click", function (e) {
  var sw = e.target.closest("[data-sw]");
  if (sw) {
    var k = +sw.getAttribute("data-st") - 1, T = state.timers[k], act = sw.getAttribute("data-sw");
    if (act === "start") { if (!T.since) T.since = Date.now(); }
    else if (act === "pause") { if (T.since) { T.acc += Date.now() - T.since; T.since = null; } }
    else if (act === "reset") {
      if (!sw.getAttribute("data-sure")) { sw.setAttribute("data-sure", "1"); sw.textContent = "Pulsa otra vez para reiniciar"; return; }
      T.acc = 0; T.since = null; buzzed[k] = false;
    }
    save(); render(); return;
  }
  var cp = e.target.closest("[data-copy]");
  if (cp) { var kind = cp.getAttribute("data-copy"), tt = +cp.getAttribute("data-t"); state[kind][tt] = state[kind][tt - 1].slice(); save(); render(); return; }
  var b = e.target.closest("[data-tab]");
  if (b) { tab = b.getAttribute("data-tab"); render(); window.scrollTo(0, 0); return; }
  var g = e.target.closest("[data-go]");
  if (g && !g.disabled) { tab = g.getAttribute("data-go"); render(); window.scrollTo(0, 0); return; }
  if (e.target.id === "clear") {
    if (e.target.getAttribute("data-sure")) {
      state.slots = new Array(TOTAL).fill(""); state.lift = blank(); state.five = blank();
      state.timers = [{ acc: 0, since: null }, { acc: 0, since: null }]; buzzed = {}; save(); render();
    } else { e.target.setAttribute("data-sure", "1"); e.target.textContent = "Pulsa otra vez para confirmar"; }
    return;
  }
  if (e.target.id === "copy") {
    var txt = planText(), box = document.getElementById("copybox"), btn = e.target;
    var fallback = function () {
      box.innerHTML = '<textarea readonly id="ta"></textarea>';
      var ta = document.getElementById("ta"); ta.value = txt; ta.focus(); ta.select();
    };
    try { navigator.clipboard.writeText(txt).then(function () { btn.textContent = "Copiado"; }, fallback); }
    catch (err) { fallback(); }
  }
});
document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.g) { state[t.dataset.g][+t.dataset.t][+t.dataset.k] = t.value; save(); refreshManualCount(t.dataset.g, +t.dataset.t); markDups(); }
  else if (t.dataset && t.dataset.i !== undefined) { state.slots[+t.dataset.i] = t.value; save(); refreshPlantillaMarks(); }
  else if (t.id === "start") { if (t.value) { state.start = t.value; save(); renderTabs(); tick(); var rg = document.getElementById("t1range"); if (rg) rg.textContent = rangesText(); } }
  else if (t.id === "q") {
    query = t.value;
    var q = query.trim().toLowerCase();
    document.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("hit", !!(q && c.getAttribute("data-login").indexOf(q) > -1)); });
    renderTrace();
  }
});

function clock(sec) { var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return pad(h) + ":" + pad(m) + ":" + pad(s); }
function tick() {
  var el = document.getElementById("status"), now = new Date();
  var s = new Date(now); s.setHours(0, 0, 0, 0); s.setMinutes(startMin());
  if (now - s < -12 * 3600000) s = new Date(s.getTime() - 86400000);
  var diff = (now - s) / 60000, html;
  if (diff < 0) {
    html = '<span class="now">Empieza a las ' + hm(startMin()) + '</span><span class="count">' + clock(Math.round(-diff * 60)) + "</span>";
  } else if (diff >= 270) {
    html = '<span class="now">Jornada terminada</span><span class="count">' + hm(startMin() + 270) + "</span>";
  } else {
    var t = Math.floor(diff / 90), leftS = Math.round((t + 1) * 5400 - diff * 60);
    html = '<span class="now">Tramo ' + (t + 1) + ' en curso</span><span class="count">' + clock(leftS) + "</span><small>" +
      (t < 2 ? "Siguiente cambio a las " + hm(startMin() + (t + 1) * 90) : "Último tramo, fin a las " + hm(startMin() + 270)) + "</small>";
  }
  if (el.getAttribute("data-h") !== html) { el.innerHTML = html; el.setAttribute("data-h", html); }
  updateSw();
}

render(); tick(); setInterval(tick, 1000);
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
</script>
