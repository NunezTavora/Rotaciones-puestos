<style>

}

}

.rules { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px; font-size: 14px; }
.rules .r { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.rules ul { margin: 0; padding-left: 18px; color: var(--warn); }

.notice ul { margin: 6px 0 0; padding-left: 18px; }

.warnmsg { color: var(--warn); font-size: 14px; margin: 10px 0 0; }

.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 15px var(--mono); padding: 6px 10px; border-radius: 5px; background: var(--bg); border: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.chip small { display: block; font: 400 11px var(--body); color: var(--muted); }
.chip small.same { color: var(--warn); }
.chip.hit { background: var(--hit); border-color: var(--ink); }
.tools { margin-top: 4px; display: grid; gap: 8px; }
.trace { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 15px; }
.trace b { font-family: var(--mono); font-weight: 500; }
.trace ol { margin: 6px 0 0; padding-left: 20px; }
.trace li { margin: 2px 0; }
textarea { width: 100%; min-height: 160px; margin-top: 10px; font: 14px var(--mono); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
.legend { margin: 10px 0 0; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.legend i { flex: 1; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--h0), var(--h1), var(--h2), var(--h3), var(--h4)); }
@media (prefers-reduced-motion: no-preference) { nav button { transition: background .15s, color .15s; } }

.minor-title{font:600 22px var(--display);text-transform:uppercase;margin:18px 0 4px}.hint{font-size:13px;color:var(--muted);margin:5px 0 10px}.manual-pos{border-style:dashed}.manual-dot{width:6px;align-self:stretch;min-height:26px;border-radius:3px;background:var(--h5)}.manual-tramo{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}.manual-add{margin-top:8px}.manual-add .btn{font-size:13px;padding:8px 11px}.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;color:var(--muted)}.tramo-intro{display:flex;align-items:end;justify-content:space-between;margin:8px 0 12px}.tramo-intro h2,.order-card h2,.timer-head h2{font:600 25px var(--display);text-transform:uppercase;margin:0}.tramo-intro>b{font:500 14px var(--mono)}.timer-card,.order-card{margin:12px 0;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}.timer-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.timer-state{font:600 11px var(--mono);padding:5px 8px;border-radius:4px;background:var(--bg)}.timer-state.running{color:var(--ok)}.timer-state.over{color:var(--warn);background:var(--hit)}.timer-time{font:500 clamp(38px,12vw,54px) var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em;margin:12px 0 4px}.timer-meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}.timer-meta b{font-family:var(--mono);color:var(--ink)}.timer-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.timer-note{font-size:12px;color:var(--muted);margin:10px 0 0}.first-move{display:grid;gap:3px;background:var(--hit);border:1px solid var(--line);padding:10px 12px;border-radius:6px;margin:12px 0}.first-move span{font:500 10px var(--mono);letter-spacing:.08em}.first-move b{font:600 20px var(--display);text-transform:uppercase}.first-move small{font:12px var(--mono)}.move-list{padding-left:24px;margin:10px 0}.move-list li{padding:7px 0;border-bottom:1px solid var(--line)}.move-list li b,.move-list li span,.move-list li small{display:block}.move-list li b{font:500 14px var(--mono)}.move-list li span{font-size:14px}.move-list li small{font-size:11px;color:var(--muted)}.coverage{border-top:1px solid var(--line);padding-top:10px;font-size:12px}.coverage-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:7px;color:var(--muted)}.coverage-list span{background:var(--bg);padding:6px;border-radius:4px}.good{color:var(--ok)}
</style>

<body>
<div class="wrap">
  <header>
    <h1>Rotación de Puestos</h1>
    <p class="sub">3 tramos de 1 h 30 min · 2 cambios en 4 h 30 min</p>
    <div class="status" id="status"></div>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>

<script>
var AUTO_POS = [
  { name: "Water Spider", short: "Spider", n: 6, distance: 1, color: "var(--h0)" },
  { name: "Feeder", short: "Feeder", n: 6, distance: 2, color: "var(--h1)" },
  { name: "Inductor", short: "Inductor", n: 6, distance: 0, color: "var(--h2)" },
  { name: "Pusher", short: "Pusher", n: 5, distance: 3, color: "var(--h3)" },
  { name: "Diverter", short: "Diverter", n: 4, distance: 5, color: "var(--h4)" }
];
var MANUAL_POS = [{ key: "fiveS", name: "5S", n: 6, labels: ["5S 1", "5S 2", "5S 3", "5S 4", "5S 5", "5S 6"] }, { key: "teamLift", name: "Team Lift", n: 6, labels: ["Feeder", "Inductor", "Water Spider", "Stower 1", "Stower 2", "5S"] }];
var POS = AUTO_POS;
var PMIN = 1, PMAX = 5, DMIN = 2, DMAX = 4, KEY = "rotpuestos.v2";
var posOfSlot = [], firstOfPos = [];
AUTO_POS.forEach(function (p, pi) { firstOfPos.push(posOfSlot.length); for (var k = 0; k < p.n; k++) posOfSlot.push(pi); });
var TOTAL = posOfSlot.length, TEMPLATE_TOTAL = TOTAL + 12;
function blankManual() { return { fiveS: new Array(6).fill(""), teamLift: new Array(6).fill("") }; }
function cloneManual(m) { return { fiveS: (m && m.fiveS ? m.fiveS : []).slice(0, 6).concat(new Array(6).fill("")).slice(0, 6), teamLift: (m && m.teamLift ? m.teamLift : []).slice(0, 6).concat(new Array(6).fill("")).slice(0, 6) }; }
function defaultTimers() { return { "2": { elapsedMs: 0, startedAt: null }, "3": { elapsedMs: 0, startedAt: null } }; }
var state = { start: "06:00", slots: [], manualTemplate: blankManual(), manual: { "1": blankManual(), "2": blankManual(), "3": blankManual() }, timers: defaultTimers(), manualOpen: { "1": {}, "2": {}, "3": {} } };
var tab = "plantilla", query = "", lastPlan = null;
function migrateSaved(saved) {
  if (!saved || !Array.isArray(saved.slots)) return;
  var s = saved.slots, auto = new Array(TOTAL).fill(""), mt = blankManual();
  if (s.length === TOTAL) auto = s.slice();
  else if (s.length === 31) {
    var oldAt = 0, oldCounts = [5, 6, 6, 4, 4, 6];
    for (var i = 0; i < 5; i++) {
      var oldN = oldCounts[i];
      for (var j = 0; j < Math.min(oldN, AUTO_POS[i].n); j++) auto[firstOfPos[i] + j] = s[oldAt + j] || "";
      oldAt += oldN;
    }
    for (var k = 0; k < 6; k++) mt.fiveS[k] = s[oldAt + k] || "";
  } else if (s.length === 25 || s.length === 23) {
    var oldCounts2 = s.length === 25 ? [5, 6, 6, 4, 4] : [5, 6, 6, 3, 3], at = 0;
    for (var x = 0; x < 5; x++) { for (var y = 0; y < Math.min(oldCounts2[x], AUTO_POS[x].n); y++) auto[firstOfPos[x] + y] = s[at + y] || ""; at += oldCounts2[x]; }
  }
  state = {
    start: saved.start || "06:00", slots: auto,
    manualTemplate: cloneManual(saved.manualTemplate || mt),
    manual: saved.manual ? { "1": cloneManual(saved.manual["1"]), "2": cloneManual(saved.manual["2"]), "3": cloneManual(saved.manual["3"]) } : { "1": cloneManual(mt), "2": cloneManual(mt), "3": cloneManual(mt) },
    timers: saved.timers || defaultTimers(),
    manualOpen: saved.manualOpen || { "1": {}, "2": {}, "3": {} }
  };
}
try { migrateSaved(JSON.parse(localStorage.getItem(KEY) || "null")); } catch (e) {}
while (state.slots.length < TOTAL) state.slots.push("");
state.manualTemplate = cloneManual(state.manualTemplate);
state.manual = state.manual || { "1": cloneManual(state.manualTemplate), "2": cloneManual(state.manualTemplate), "3": cloneManual(state.manualTemplate) };
["1", "2", "3"].forEach(function (t) { state.manual[t] = cloneManual(state.manual[t] || state.manualTemplate); state.manualOpen[t] = state.manualOpen[t] || {}; });
state.timers = state.timers || defaultTimers();
["2", "3"].forEach(function (t) { if (!state.timers[t]) state.timers[t] = { elapsedMs: 0, startedAt: null }; });
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function startMin() { var p = (state.start || "06:00").split(":"); return (+p[0]) * 60 + (+p[1]); }
function hm(min) { min = ((min % 1440) + 1440) % 1440; return pad(Math.floor(min / 60)) + ":" + pad(min % 60); }
function range(t) { var s = startMin() + t * 90; return hm(s) + "–" + hm(s + 90); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function manualValues(m) { return (m.fiveS || []).concat(m.teamLift || []); }
function allTemplateValues() { return state.slots.concat(manualValues(state.manualTemplate)); }
function duplicateKeys(values) { var seen = {}, d = {}; values.forEach(function (v) { var k = String(v || "").trim().toLowerCase(); if (!k) return; if (seen[k]) d[k] = 1; seen[k] = 1; }); return d; }
function dupSet() { return duplicateKeys(allTemplateValues()); }
function dupSetTramo(t) { return duplicateKeys(state.slots.concat(manualValues(state.manual[String(t)]))); }
function baseCounts() { var c = [0, 0, 0, 0, 0]; state.slots.forEach(function (v, i) { if (String(v).trim()) c[posOfSlot[i]]++; }); return c; }
function validate(c) {
  var m = [];
  if (c[0] < 1 || c[0] > 6) m.push("Water Spider: debe haber entre 1 y 6 personas (hay " + c[0] + ").");
  if (c[1] !== c[2]) m.push("Feeder e Inductor deben tener el mismo número (hay " + c[1] + " y " + c[2] + ").");
  if (c[3] < PMIN || c[3] > PMAX) m.push("Pusher: debe haber entre " + PMIN + " y " + PMAX + " personas (hay " + c[3] + ").");
  if (c[4] < DMIN || c[4] > DMAX) m.push("Diverter: debe haber entre " + DMIN + " y " + DMAX + " personas (hay " + c[4] + ").");
  return m;
}
function workers() { var w = []; state.slots.forEach(function (v, i) { if (String(v).trim()) w.push({ login: String(v).trim(), p0: posOfSlot[i] }); }); return w; }
/* Coste: evita repetir puesto; favorece avanzar hacia puestos más fríos. Los saltos desde frío hacia caliente reciben una penalización mayor. */
function mcost(p, q, hist) {
  if (p === q) return 90;
  var delta = q - p, travel = Math.abs(AUTO_POS[p].distance - AUTO_POS[q].distance) * 3;
  var c = travel + (delta > 0 ? Math.max(0, delta - 1) : 12 + (Math.abs(delta) - 1) * 5);
  if (hist.indexOf(q) > -1) c += 28;
  return c;
}
function hungarian(a, n) {
  var INF = 1e9, u = new Array(n + 1).fill(0), v = new Array(n + 1).fill(0), p = new Array(n + 1).fill(0), way = new Array(n + 1).fill(0);
  for (var i = 1; i <= n; i++) {
    p[0] = i; var j0 = 0, minv = new Array(n + 1).fill(INF), used = new Array(n + 1).fill(false);
    do {
      used[j0] = true; var i0 = p[j0], delta = INF, j1 = 0;
      for (var j = 1; j <= n; j++) if (!used[j]) { var cur = a[i0 - 1][j - 1] - u[i0] - v[j]; if (cur < minv[j]) { minv[j] = cur; way[j] = j0; } if (minv[j] < delta) { delta = minv[j]; j1 = j; } }
      for (var k = 0; k <= n; k++) { if (used[k]) { u[p[k]] += delta; v[k] -= delta; } else minv[k] -= delta; }
      j0 = j1;
    } while (p[j0] !== 0);
    do { var jj = way[j0]; p[j0] = p[jj]; j0 = jj; } while (j0);
  }
  var res = new Array(n); for (var x = 1; x <= n; x++) res[p[x] - 1] = x - 1; return res;
}
function solveStep(pos, hist, counts) {
  var slotPos = []; counts.forEach(function (c, q) { for (var k = 0; k < c; k++) slotPos.push(q); });
  if (slotPos.length !== pos.length) return { err: "No se puede calcular: las plazas no coinciden con el número de trabajadores." };
  var a = pos.map(function (p, w) { return slotPos.map(function (q) { return mcost(p, q, hist[w]); }); });
  var asg = hungarian(a, pos.length), np = []; for (var w = 0; w < pos.length; w++) np[w] = slotPos[asg[w]];
  return { pos: np };
}
function computePlan() {
  var W = workers(), counts = baseCounts(), p0 = W.map(function (w) { return w.p0; }), hist = W.map(function (w) { return [w.p0]; });
  var s1 = solveStep(p0, hist, counts); if (s1.err) return { err: s1.err };
  var h1 = hist.map(function (h, i) { return h.concat([s1.pos[i]]); });
  var s2 = solveStep(s1.pos, h1, counts); if (s2.err) return { err: s2.err };
  return { W: W, p: [p0, s1.pos, s2.pos], counts: counts };
}
function renderTabs() {
  var filled = allTemplateValues().filter(function (s) { return String(s).trim(); }).length;
  var items = [["plantilla", "Plantilla", filled + "/" + TEMPLATE_TOTAL]];
  for (var t = 0; t < 3; t++) items.push([String(t), "Tramo " + (t + 1), hm(startMin() + t * 90)]);
  document.getElementById("tabs").innerHTML = items.map(function (it) { return '<button role="tab" data-tab="' + it[0] + '" aria-selected="' + (String(tab) === it[0]) + '">' + it[1] + "<small>" + it[2] + "</small></button>"; }).join("");
}
function manualTemplateHtml() {
  var html = '<h2 class="minor-title">Puestos de gestión manual</h2><p class="hint">Estos puestos no participan en la escala de calor/frío. Sus asignaciones iniciales se copian a los tres tramos y después puedes modificarlas por separado.</p>';
  MANUAL_POS.forEach(function (p) {
    var cells = "";
    for (var k = 0; k < 6; k++) cells += '<div class="slot"><label>' + p.labels[k] + '</label><input type="text" data-mt="' + p.key + '" data-i="' + k + '" value="' + esc(state.manualTemplate[p.key][k] || "") + '" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="login"></div>';
    html += '<section class="pos manual-pos"><div class="pos-head"><span class="manual-dot"></span><h2>' + p.name + '</h2><span class="cnt" id="manual-cnt-' + p.key + '">' + state.manualTemplate[p.key].filter(function (v) { return String(v).trim(); }).length + '/6</span></div><div class="grid">' + cells + '</div></section>';
  });
  return html;
}
function rulesHtml() {
  var errs = validate(baseCounts()), h = '<p class="r">Spider 1–6 · Feeder = Inductor · Pusher 1–5 · Diverter 2–4 · 5S y Team Lift: gestión manual</p>';
  h += errs.length ? "<ul>" + errs.map(function (e) { return "<li>" + e + "</li>"; }).join("") + "</ul>" : '<p class="good">La plantilla de rotación automática cumple las reglas.</p>';
  return h;
}

function buildMoves(P, t) {

document.addEventListener("input", function (e) {
